requirement_baseline:
  id: R1.0
  status: RECONSTRUCTED
  established_at: 2026-10-04
  source: legacy adoption audit
requirements:
  - id: REQ-001
    title: "接管审计与基线治理"
    statement: "接管既有项目时，先重建稳定基线、版本、能力、风险、证据和后续任务。"
    status: ACTIVE
    priority: MUST
    release: 1.0.0
    goal_refs: [GOAL-001]
    scope_tags: [governance]
    non_goals: [修复源池质量问题, 修改发布产物, 增加业务功能]
    acceptance_criteria: [AC-001, AC-002, AC-003, AC-004]
    source: adoption audit
  - id: REQ-201
    title: "自动发现和准入公开源"
    statement: "系统能从公开入口发现候选源，并完成格式、可达性和基础结构准入。"
    status: BASELINE
    priority: MUST
    release: 1.0.0
    goal_refs: [GOAL-001]
    scope_tags: [data]
    non_goals: []
    acceptance_criteria: []
    source: reconstructed from README and app/discovery
  - id: REQ-202
    title: "健康检测、评分和生命周期"
    statement: "系统能执行分层健康检测，按评分和稳定性维护源状态，并在连续失败或恢复时调整输出。"
    status: BASELINE
    priority: MUST
    release: 1.0.0
    goal_refs: [GOAL-001]
    scope_tags: [data, testing]
    non_goals: []
    acceptance_criteria: []
    source: reconstructed from README, app/checks and app/scoring
  - id: REQ-203
    title: "安全构建和 Pages 发布"
    statement: "系统能生成固定入口的 tvbox.json，并在构建不合法时保留 last-known-good。"
    status: BASELINE
    priority: MUST
    release: 1.0.0
    goal_refs: [GOAL-002]
    scope_tags: [data, release]
    non_goals: []
    acceptance_criteria: []
    source: reconstructed from README, app/build and workflows
  - id: REQ-204
    title: "自动调度、告警和只读面板"
    statement: "系统通过 GitHub Actions 定时运行，提供状态面板，并支持可选的告警通道。"
    status: BASELINE
    priority: SHOULD
    release: 1.0.0
    goal_refs: [GOAL-002, GOAL-003]
    scope_tags: [api, ui]
    non_goals: []
    acceptance_criteria: []
    source: reconstructed from README, workflows and dashboard
  - id: REQ-101
    title: "用真实影视仓 6.1.8 验证输出格式"
    statement: "必须用真实客户端核对 tvbox.json 字段布局，而不是依赖 demo 或网络文章。"
    status: PLANNED
    priority: MUST
    release: 1.1.0
    goal_refs: [GOAL-002, GOAL-003]
    scope_tags: [compatibility, testing]
    non_goals: [猜测字段布局]
    acceptance_criteria: [AC-101]
    source: adoption audit
  - id: REQ-102
    title: "建立真实中国大陆探测节点"
    statement: "用真实大陆节点验证源可达性，避免把海外 runner 的成功当成大陆可达。"
    status: PLANNED
    priority: MUST
    release: 1.1.0
    goal_refs: [GOAL-004]
    scope_tags: [regions, testing]
    non_goals: [仅修改地区标签]
    acceptance_criteria: [AC-102]
    source: adoption audit
  - id: REQ-103
    title: "降低第三方镜像依赖风险"
    statement: "记录、监测或替换 gh-proxy.com / jsdelivr 等发布链路依赖，降低单点失效影响。"
    status: PLANNED
    priority: SHOULD
    release: 1.1.0
    goal_refs: [GOAL-002]
    scope_tags: [resilience, testing]
    non_goals: [静默取消镜像]
    acceptance_criteria: [AC-103]
    source: adoption audit
  - id: REQ-104
    title: "只发布有真实播放证据的源"
    statement: "构建发布时，除人工白名单明确保留的源外，源必须在近期探测中同时通过搜索和播放，且播放响应 Content-Type 必须是可播放媒体类型；只有配置可解析不能再进入发布产物。"
    status: ACTIVE
    priority: MUST
    release: 1.1.0
    goal_refs: [GOAL-001, GOAL-002, GOAL-003]
    scope_tags: [data, release, testing]
    non_goals: [修改源发现范围, 放宽客户端兼容性验证]
    acceptance_criteria: [AC-104]
    source: "2026-10-04 真实手机测试反馈：多数源不可播"
  - id: REQ-105
    title: "保留人工验证过的可播源"
    statement: "用户实机验证过可播放的源可以加入人工白名单；白名单源绕过自动播放门槛继续发布，但检测、评分和镜像仍照常执行。"
    status: ACTIVE
    priority: MUST
    release: 1.1.0
    goal_refs: [GOAL-001, GOAL-002, GOAL-003]
    scope_tags: [data, release, testing]
    non_goals: [声称白名单源已通过自动播放探测, 扩大未经验证的源]
    acceptance_criteria: [AC-105]
    source: "2026-10-04 用户要求保留手机实测可播的豆了和精东"
  - id: REQ-601
    title: "JAR/csp 源必须通过 Android 真机门禁"
    statement: "带 csp_* 或 JAR 站点的源，必须先完成 Android DexClassLoader 并真实拉到媒体字节，才允许进入发布集。"
    status: ACTIVE
    priority: MUST
    release: 1.1.0
    goal_refs: [GOAL-001, GOAL-002, GOAL-003]
    scope_tags: [data, release, testing]
    non_goals: [伪造真机结果, 放宽发布门槛凑数量]
    acceptance_criteria: [AC-601]
    source: "2026-10-04 用户手机实测 360 / 茅台 jar 解析失败"
  - id: REQ-602
    title: "真机播放证据可替代 runner 侧 L5"
    statement: "JAR 源的真机可播证据可以替代 runner 侧失败的 L5 播放探针，但搜索证据仍必须单独成立。"
    status: ACTIVE
    priority: MUST
    release: 1.1.0
    goal_refs: [GOAL-001, GOAL-002, GOAL-003]
    scope_tags: [data, release, testing]
    non_goals: [跳过搜索验证]
    acceptance_criteria: [AC-602]
    source: "2026-10-04 T-006 实现"
  - id: REQ-603
    title: "内容去重包含 csp 类名"
    statement: "内容去重指纹必须包含 csp_* 类名，避免内容不同的 JAR 源因 CMS 主机子集被误判为镜像。"
    status: ACTIVE
    priority: MUST
    release: 1.1.0
    goal_refs: [GOAL-001, GOAL-002, GOAL-003]
    scope_tags: [data, release, testing]
    non_goals: [放宽所有去重]
    acceptance_criteria: [AC-603]
    source: "2026-10-04 T-006 实现"
  - id: REQ-604
    title: "零站点真机结果不写入证据"
    statement: "配置未下载成功（site_count=0）的真机结果不得写入 data/android_verified.json。"
    status: ACTIVE
    priority: MUST
    release: 1.1.0
    goal_refs: [GOAL-001, GOAL-003]
    scope_tags: [data, testing]
    non_goals: [用零站点记录凑证据数量]
    acceptance_criteria: [AC-604]
    source: "2026-10-04 T-006 实现"
  - id: REQ-701
    title: "发布入口必须走可用镜像"
    statement: "构建命令必须显式提供 GITHUB_REPOSITORY，确保 dist/tvbox.json 与 CDN 条目的 URL 全部走可用镜像，而不是手机打不开的 raw.githubusercontent.com。"
    status: ACTIVE
    priority: MUST
    release: 1.1.0
    goal_refs: [GOAL-002]
    scope_tags: [data, release]
    non_goals: [取消镜像回退]
    acceptance_criteria: [AC-701]
    source: "2026-10-04 用户手机端打不开原点入口"
  - id: REQ-702
    title: "真机证据只允许不弱结果覆盖"
    statement: "jar_check.write_evidence 只允许不弱于既有记录的真机结果覆盖，避免窄抽样弱结果冲掉全量强证据；同强度允许刷新时间戳。"
    status: ACTIVE
    priority: MUST
    release: 1.1.0
    goal_refs: [GOAL-001, GOAL-003]
    scope_tags: [data, testing]
    non_goals: [删除历史证据]
    acceptance_criteria: [AC-702]
    source: "2026-10-04 T-007 实现"
  - id: REQ-703
    title: "已证实可播源不得被弱抽样撤下"
    statement: "jsm 全量真机跑出的 playable=1 不得再被 20 站窄抽样覆盖，重建后必须回归发布集。"
    status: ACTIVE
    priority: MUST
    release: 1.1.0
    goal_refs: [GOAL-001, GOAL-002]
    scope_tags: [data, release, testing]
    non_goals: [手工写死发布名单]
    acceptance_criteria: [AC-703]
    source: "2026-10-04 T-007 回归"
  - id: REQ-704
    title: "持续扩充真机可播源"
    statement: "继续对高产区候选补全量或放宽抽样真机证据，发现更多手机端真正可播的源；未验证源不得预先声称可播。"
    status: ACTIVE
    priority: SHOULD
    release: 1.1.0
    goal_refs: [GOAL-001, GOAL-002, GOAL-003]
    scope_tags: [data, testing]
    non_goals: [伪造真机结果, 用成人源凑数量]
    acceptance_criteria: [AC-704]
    source: "2026-10-05 用户要求继续找更多可用源"
