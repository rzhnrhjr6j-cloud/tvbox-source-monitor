name: health-check

# spec §20 / §21 - probe every known source every 30 minutes.
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tvbox-data-write
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Health check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_GITHUB_REPO: ${{ github.repository }}
          # optional alert channels - an unset secret simply disables its channel
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m app.main check --json

      - name: Commit results back to the repository
        run: |
          set -euo pipefail
          git config user.name  "tvbox-source-monitor[bot]"
          git config user.email "tvbox-source-monitor@users.noreply.github.com"
          git add -A data
          if [ -d dist ]; then git add -A dist; fi
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "chore(health): record probe results"
          # the DB is a shared artifact: rebase before pushing and retry
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 5))
          done
          echo "could not push after 3 attempts" >&2
          exit 1
