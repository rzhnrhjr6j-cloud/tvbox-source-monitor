  # list also carries 麻豆 / 黄色仓库 / 51吃瓜), so filtering top-level names
  # alone would leak them.  A config that had rows removed is re-published
  # under <dir>/sources/ and the clean entry points there; a source that had
  # nothing removed keeps its own URL, so nothing is duplicated needlessly.
  #
  # Adding or removing a rule here is the only edit needed - the next build
  # picks it up.  Set enabled: false to stop producing the second entry.
