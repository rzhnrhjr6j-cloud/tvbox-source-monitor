# 抓上游清单时套的前缀（大陆直连 GitHub 会超时）
proxy_prefix: "https://gh-proxy.com/"
fetch_timeout: 20

output:
  file: live.m3u
  txt_file: live.txt
  # 同一个频道名最多留几条线路（客户端里就是「源1/源2/源3」）
  max_per_name: 3
  # 分组上限，防止「其他」变成垃圾场（这个是实测里最大的一组）
  max_per_group:
    其他: 300
    # 国外候选有几千条，先按上限切一批出来实测（能播的排前面）
    国外: 600
  # 0 = 全收
  max_channels: 0
  # 这些组里，一个频道要是有实测能播的线路才发；一条都没有就整条不发。
  # 港澳台上游死链极多（实测 149 条地址只有 16 条能播），全发出去的结果是
  # 用户点谁谁「播放失败」，比没有还糟。
  require_alive_groups:
    - 港澳台
    - 国外
  # 出问题时给客户端的备选地址：第一个写进 tvbox-live.json
  bases:
    - "https://gh-proxy.com/https://raw.githubusercontent.com/rzhnrhjr6j-cloud/tvbox-source-monitor/main/dist"
    - "https://ghfast.top/https://raw.githubusercontent.com/rzhnrhjr6j-cloud/tvbox-source-monitor/main/dist"
    - "https://rzhnrhjr6j-cloud.github.io/tvbox-source-monitor"
  # 合并条目在 tvbox-live.json 里的名字
  entry_name: "合并直播 · 央视卫视地方（推荐）"

# 逐条频道实测。只有在本机（大陆网络）跑才有意义：GitHub 构建机够不到大陆
# 的流，会把好频道判成坏。跑出来的结论落在 data/live_probe.json 里并提交，
# 构建时按这份结果排序（能播的排前面）。
#
# 判定方式 = 模拟播放器：先拉清单，再拉第一个分片。只有分片也回来才算 alive。
#   alive   = 分片能拉到
#   dead    = 404/410/403/451/523，或者 2xx 回来的是 HTML 错误页，或者分片 404
#   unknown = 超时 / 连接重置 / 其它说不清的（保留，排在后面当「源2/源3」）
probe:
  enabled: true
  # 别开太大：这些是大站点之外的土服务器，64 并发会被限流，反而把好频道
  # 判成 unknown。
  workers: 24
  connect_timeout: 5
  read_timeout: 12
  cache: data/live_probe.json
